<!doctype html><html lang="ja"><meta charset="utf-8"><title>Dynamic catalogue rendering workload</title><style>body{background:#fff;color:#252f3d;margin:24px;font:16px Arial}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#f7f7f7;padding:12px;border-radius:8px}.tile{height:100px;background:#dbe2e7}.grid a{color:#315d8a}#batch{margin:16px}</style><h1>Dynamic catalogue workload</h1><p>This synthetic workload separates initial visible paint, offscreen scanning and nested mutation batches. It models the reported BOOTH/Amazon workload; it is not copied page content or a claim about all network/lazy-load work.</p><button id="batch">Insert a nested batch</button><div class="grid"></div><script>const make=n=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="tile"></div><h2>作品 '+n+'</h2><p>商品情報</p><a href="#item-'+n+'">詳細</a>';return c};for(let n=0;n<300;n++)document.querySelector('.grid').append(make(n));document.querySelector('#batch').onclick=()=>{const g=document.createElement('section');g.className='grid';document.body.prepend(g);for(let n=0;n<12;n++){const c=make(n);g.append(c);c.querySelector('p').classList.add('inserted')}};document.documentElement.dataset.fixtureReady='yes'</script></html>
