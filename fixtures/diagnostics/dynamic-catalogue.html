<!doctype html><html lang="ja"><meta charset="utf-8"><title>Dynamic catalogue rendering workload</title><style>body{background:#fff;color:#252f3d;margin:24px;font:16px Arial}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#f7f7f7;padding:12px;border-radius:8px}.tile{height:100px;background:#dbe2e7}.grid a{color:#315d8a}#batch{margin:16px}</style><h1>Dynamic catalogue workload</h1><p>This synthetic workload separates initial visible paint, offscreen scanning and nested mutation batches. It models the reported BOOTH/Amazon workload; it is not copied page content or a claim about all network/lazy-load work.</p><button id="batch">Insert a nested batch</button><div class="grid"></div><script>const experiment=new URLSearchParams(location.search);const requestedCount=Number(experiment.get('cards'));const cardCount=[100,300].includes(requestedCount)?requestedCount:300;if(experiment.has('css')){const sheet=document.createElement('style');sheet.textContent=experiment.get('css')==='heavy'?Array.from({length:128},(_,i)=>`.grid > .card:not([data-synthetic-rule-${i}]) { border-radius:8px; }`).join('\n'):'';document.head.append(sheet)}const make=n=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="tile"></div><h2>作品 '+n+'</h2><p>商品情報</p><a href="#item-'+n+'">詳細</a>';if(experiment.get('colors')==='varied'){c.style.backgroundColor='rgb('+(220+n%32)+','+(220+Math.floor(n/32)%32)+',240)';c.style.border='1px solid rgb('+(60+n%128)+','+(60+Math.floor(n/128)*40)+',130)'}return c};for(let n=0;n<cardCount;n++)document.querySelector('.grid').append(make(n));document.querySelector('#batch').onclick=()=>{const g=document.createElement('section');g.className='grid';document.body.prepend(g);for(let n=0;n<12;n++){const c=make(n);g.append(c);c.querySelector('p').classList.add('inserted')}};document.documentElement.dataset.fixtureReady='yes'</script></html>
