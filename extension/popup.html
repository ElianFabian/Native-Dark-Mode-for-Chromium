<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native Dark Mode</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1 data-i18n="title">Native Dark Mode</h1>
  <p id="site">Checking tab…</p>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="exclude-host" hidden>Exclude this subdomain</button>
  <label><span data-i18n="address">Website or section URL</span><input id="address" type="text" placeholder="https://example.com/articles/"></label>
  <label><span data-i18n="scope">Scope</span><select id="scope"><option value="website" data-i18n="website">Entire website</option><option value="section" data-i18n="section">Path section</option></select></label>
  <label><input id="subdomains" type="checkbox"> <span data-i18n="subdomains">Include subdomains</span></label>
  <label id="regional-option" hidden><input id="regional" type="checkbox"> <span data-i18n="regionalDomains">Include regional domains</span></label>
  <p class="note" id="scope-hint"></p>
  <button id="toggle" disabled>Please wait…</button>
  <button id="save" disabled data-i18n="save">Save settings</button>
  <p class="note" data-i18n="rulesNote">Saved locally. Disabled rules remain as exclusions. More specific sections take priority. Queries and fragments are ignored.</p>
  <h2 data-i18n="savedRules">Saved websites and sections</h2>
  <div id="rules"></div>
  <p id="rule-count" class="note"></p>
  <button id="manage" data-i18n="manageRules">Manage rules</button>
  <p class="note" data-i18n="debugNote">Brave may show a debugging banner. Closing it or opening DevTools may disconnect dark mode.</p>
  <details><summary data-i18n="diagnostics">Diagnostics</summary><pre id="diagnostic"></pre></details>
</main>
<script src="popup.js" type="module"></script>
</html>
